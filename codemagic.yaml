workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Extract ZIP File
        script: |
          unzip "neoncall-purple-studio (6).zip" -d ./extracted_app
          APP_DIR=$(find ./extracted_app -type f -name "package.json" -exec dirname {} \; | head -n 1)
          if [ ! -z "$APP_DIR" ]; then
            cp -R $APP_DIR/* . || true
            cp -R $APP_DIR/.* . || true
          fi
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android App
        script: |
          ANDROID_DIR=$(find . -type d -name "android" | head -n 1)
          if [ ! -z "$ANDROID_DIR" ]; then
            cd "$ANDROID_DIR" && ./gradlew assembleRelease
          else
            exit 1
          fi
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      
