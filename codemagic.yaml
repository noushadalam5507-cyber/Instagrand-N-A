workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Extract ZIP File
        script: |
          unzip "neoncall-purple-studio (6).zip" -d ./extracted_app
          find ./extracted_app -mindepth 1 -maxdepth 2 -type f -name "package.json" -exec dirname {} \; > folder_path.txt
          INNER_DIR=$(cat folder_path.txt)
          if [ ! -z "$INNER_DIR" ]; then
            cp -R $INNER_DIR/* . || true
          fi
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android App
        script: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleRelease
          else
            cd */android && ./gradlew assembleRelease
          fi
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      
      
