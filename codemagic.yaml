workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Create Mobile App Engine
        script: |
          unzip "neoncall-purple-studio (6).zip" -d ./extracted_app
          npx create-expo-app@latest my-mobile-app --template blank --no-install --yes
          cd my-mobile-app
          rm -rf src
          EXACT_SRC=$(find ../extracted_app -type d -name "src" | head -n 1)
          if [ -z "$EXACT_SRC" ]; then
            cp -R ../extracted_app/* src
          else
            cp -R "$EXACT_SRC/." src
          fi
          npm install
          npx expo prebuild --clean --no-interactive
          CI=1 npx expo run:android --variant release --no-interactive
          
