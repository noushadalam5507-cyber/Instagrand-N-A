workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Create Mobile App Engine
        script: |
          unzip "neoncall-purple-studio (6).zip" -d ./extracted_app
          PROJECT_DIR=$(find ./extracted_app -name "package.json" -maxdepth 3 | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
              cd ./extracted_app
          else
              cd "$(dirname "$PROJECT_DIR")"
          fi
          npm install
          npx expo install expo
          npx expo prebuild --clean
          npx expo run:android --variant release
          
